name: Daily Waitlist Tracker

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Log today's waitlist position
        env:
          TRACKING_URL: ${{ secrets.TRACKING_URL }}
        run: python tracker.py log --marathon-date 2026-12-07

      - name: Commit updated history and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/waitlist_history.csv reports/waitlist_report.md reports/position_over_time.svg
          if git diff --cached --quiet; then
            echo "No updates to commit"
            exit 0
          fi
          git commit -m "chore: update waiting list snapshot"
          git push
